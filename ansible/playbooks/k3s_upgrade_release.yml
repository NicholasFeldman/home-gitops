# Rolling Ubuntu release upgrade to the next LTS (e.g. 22.04 -> 24.04), one
# node at a time, with the same drain and recovery checks as k3s_upgrade_os.yml.
# Each VM is snapshotted in Proxmox before the drain; the snapshot is deleted
# once the node is back and the cluster has recovered, unless keep_snapshot.
#
# Run it after k3s_upgrade_os.yml, with the Proxmox inventory loaded too:
#   ansible-playbook -i inventories/skywalker.yml -i inventories/proxmox.yml \
#     playbooks/k3s_upgrade_release.yml -K -e release_target=24.04
# Then re-run configure-vms.yml.
#
# A failed node is left cordoned with its snapshot. To roll it back, on the
# Proxmox node hosting it: qm rollback <vmid> pre-release-24-04 && qm start <vmid>
# then uncordon it.

- hosts: k3s_cluster_agent:k3s_cluster_server
  become: true
  serial: 1
  vars:
    # The discovered interpreter (python3.10 on 22.04) is removed by the
    # upgrade, which leaves the async poll of do-release-upgrade failing
    # until its timeout; /usr/bin/python3 exists on both releases
    ansible_python_interpreter: /usr/bin/python3
    cnpg_namespace: database
    cnpg_cluster: primary-cluster
    snapshot_name: pre-release-{{ release_target | replace('.', '-') }}
    snapshot_reason: upgrading to Ubuntu {{ release_target }}
    snapshot_min_free_gb: 20
    keep_snapshot: false
  tasks:
    - name: Require a target release and the Proxmox inventory
      ansible.builtin.assert:
        that:
          - release_target is defined
          - groups['proxmox'] | default([]) | length > 0
        fail_msg: Pass -e release_target=<e.g. 24.04> and -i inventories/proxmox.yml
      run_once: true
      become: false

    - name: Find the current release
      ansible.builtin.command: lsb_release -rs
      register: release_before
      changed_when: false
      check_mode: false

    - name: Skip {{ inventory_hostname }}, already on {{ release_before.stdout }}
      ansible.builtin.meta: end_host
      when: release_before.stdout is version(release_target, '>=')

    # The next LTS isn't always the one wanted (24.04 nodes are offered 26.04
    # before k3s and Longhorn support it), so check it before draining
    - name: Check the offered release is {{ release_target }}
      ansible.builtin.command: do-release-upgrade -c
      register: release_check
      changed_when: false
      failed_when: "\"New release '\" ~ release_target ~ \".\" not in release_check.stdout"
      check_mode: false

    # Before the drain, so a node without room for a snapshot fails untouched
    - ansible.builtin.import_tasks: tasks/proxmox_snapshot.yml

    - ansible.builtin.import_tasks: tasks/k3s_drain_node.yml

    # do-release-upgrade refuses to run on an out-of-date system or one with a
    # reboot pending
    - name: Bring the current release up to date
      ansible.builtin.apt:
        upgrade: dist
        update_cache: true
        autoremove: true
        autoclean: true

    - name: Check for a pending reboot
      ansible.builtin.stat:
        path: /var/run/reboot-required
      register: reboot_required

    - name: Reboot into the updated release
      ansible.builtin.reboot:
        reboot_timeout: 1800
      when: reboot_required.stat.exists

    # The non-interactive frontend keeps existing config files (multipath.conf,
    # sysctl.d) when a package ships a new default. Async so a dropped SSH
    # session doesn't kill the upgrade halfway.
    - name: Upgrade to the next LTS
      ansible.builtin.command: do-release-upgrade -f DistUpgradeViewNonInteractive
      # b4k1d's HDD-backed upgrade ran past 2h; at the limit async_wrapper kills
      # the upgrade mid-dpkg
      async: 21600
      poll: 30

    - name: Reboot into the new release
      ansible.builtin.reboot:
        reboot_timeout: 1800

    - name: Record the release after upgrading
      ansible.builtin.command: lsb_release -rs
      register: release_after
      changed_when: false

    - name: Check the node is on {{ release_target }}
      ansible.builtin.assert:
        that: release_after.stdout == release_target
        fail_msg: On {{ release_after.stdout }}, not {{ release_target }}; check /var/log/dist-upgrade/ (node left cordoned)

    - ansible.builtin.import_tasks: tasks/k3s_restore_node.yml

    - name: Delete snapshot {{ snapshot_name }} of VM {{ pve_vmid }}
      ansible.builtin.command: qm delsnapshot {{ pve_vmid }} {{ snapshot_name }}
      delegate_to: "{{ pve_node }}"
      become: false
      when: not keep_snapshot | bool
