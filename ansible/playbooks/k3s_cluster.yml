- hosts: k3s_cluster_server
  tasks:
    - set_fact:
        k3s_control_node: true
        k3s_etcd_datastore: true
        k3s_server:
          disable:
            - traefik
            - servicelb

# a7h7w runs on alderaan's HDDs, so it only hosts etcd and the control plane
- hosts: skywalker-control-plane-a7h7w
  tasks:
    - set_fact:
        k3s_server: "{{ k3s_server | combine({'node-taint': ['node-role.kubernetes.io/control-plane:NoSchedule']}) }}"

- hosts: k3s_cluster_agent
  tasks:
    - set_fact:
        k3s_control_node: false

- hosts: k3s_cluster_server, k3s_cluster_agent
  become: true
  roles:
    - role: geerlingguy.swap
    - role: xanmanning.k3s
  vars:
    swap_file_state: absent
    k3s_become: true
    k3s_release_version: v1.29.2+k3s1
