apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

metadata:
  name: meshmonitor

resources:
  - meshmonitor-env.sealed-secret.yaml

helmCharts:
  - name: app-template
    repo: https://bjw-s-labs.github.io/helm-charts
    releaseName: meshmonitor
    version: 5.0.1
    namespace: mesh
    valuesFile: meshmonitor.values.yaml
    apiVersions:
      - gateway.networking.k8s.io/v1/HTTPRoute
