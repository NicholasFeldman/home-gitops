apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

metadata:
  name: corescope

helmCharts:
  - name: app-template
    repo: https://bjw-s-labs.github.io/helm-charts
    releaseName: corescope
    version: 5.0.1
    namespace: mesh
    valuesFile: corescope.values.yaml
    apiVersions:
      - gateway.networking.k8s.io/v1/HTTPRoute
