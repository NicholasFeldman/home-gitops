controllers:
  corescope:
    # SQLite on a ReadWriteOnce volume, and upstream is explicit that only one
    # CoreScope instance may touch a DB file; never run two replicas
    strategy: Recreate
    containers:
      app:
        image:
          repository: ghcr.io/kpa-clawbot/corescope
          # CoreScope's image tags keep the leading "v" of the git tag
          tag: v3.10.1
        env:
          TZ: America/New_York

          # istio terminates TLS and the broker lives in the monitoring
          # namespace, so the bundled caddy and mosquitto are dead weight.
          # Disabling both selects supervisord-go-no-mosquitto-no-caddy.conf,
          # which runs just the ingestor and the server on :3000.
          DISABLE_CADDY: "true"
          DISABLE_MOSQUITTO: "true"

          # gates /ws upgrades as well as CORS. "*" is deliberately not honoured
          # for the websocket, so this has to be the real origin.
          CORS_ALLOWED_ORIGINS: https://corescope.feldman.in

          # keep Go's GC under the container limit so it collects instead of
          # being OOMKilled; upstream advises >= 1.5x the working set
          GOMEMLIMIT: 768MiB
        # without these the namespace LimitRange caps the container at 256Mi,
        # which the in-memory packet store outgrows
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            memory: 1Gi
        probes:
          liveness:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /api/stats
                port: 3000
              initialDelaySeconds: 30
              periodSeconds: 30
              failureThreshold: 5
          readiness:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /api/stats
                port: 3000
              initialDelaySeconds: 15
              periodSeconds: 10
              failureThreshold: 5

# deliberately no runAsUser: the image has no USER directive and its supervisord
# config sets user=root with a pidfile in /var/run, so a non-root uid cannot
# start the process group (same reasoning as mqttx-web)

persistence:
  # meshcore.db, config.json and theme.json all live here. config.json is
  # written by hand after first boot -- it carries the mosquitto password and
  # the apiKey, and the app rewrites it in place (SaveGeoFilter does a
  # temp-file-plus-rename), so it cannot be a secret or configMap mount.
  data:
    enabled: true
    accessMode: ReadWriteOnce
    size: 5Gi
    globalMounts:
      - path: /app/data

service:
  app:
    controller: corescope
    ports:
      http:
        port: 3000

route:
  app:
    enabled: true
    parentRefs:
      - name: feldman-in
        namespace: istio-system
    hostnames: ["corescope.feldman.in"]
    rules:
      - backendRefs:
          - name: corescope
            port: 3000
            namespace: mesh
