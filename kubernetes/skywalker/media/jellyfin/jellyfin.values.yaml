controllers:
  jellyfin:
    containers:
      app:
        image:
          repository: jellyfin/jellyfin
          tag: 10.11.11
        env:
          TZ: America/New_York
        probes:
          liveness:
            enabled: true
          readiness:
            enabled: true
          startup:
            enabled: true
            spec:
              failureThreshold: 30
              periodSeconds: 5

service:
  app:
    controller: jellyfin
    forceRename: jellyfin
    ports:
      http:
        port: 8096

persistence:
  config:
    type: custom
    volumeSpec:
      iscsi:
        targetPortal: 10.10.90.30:3260
        iqn: iqn.2005-10.org.freenas.ctl:skywalker-jellyfin-config
        lun: 0
        fsType: ext4
    globalMounts:
      - path: /config
  media:
    type: nfs
    server: truenas.feldman.in
    path: /mnt/primary/Media
    globalMounts:
      - path: /media
