csi:
  kubeletRootDir: /var/lib/kubelet
persistence:
  reclaimPolicy: Retain
defaultSettings:
  createDefaultDiskLabeledNodes: true
  # Move volumes onto the new engine image after each Longhorn upgrade, one
  # volume per node at a time
  concurrentAutomaticEngineUpgradePerNodeLimit: 1
# Since 1.8 the backup target is a BackupTarget resource rather than a setting
defaultBackupStore:
  backupTarget: nfs://truenas.feldman.in:/mnt/primary/Longhorn-Backups
