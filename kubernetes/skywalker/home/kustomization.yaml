apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

metadata:
  name: home
  
namespace: home

resources:
  - home.namespace.yaml
  - home.limitrange.yaml
  
  - vikunja-env.sealed-secret.json
  - vikunja.postgres.yaml

  - paperless-env.sealed-secret.yaml
  - paperless.postgres.yaml

helmCharts:
  - name: app-template
    repo: https://bjw-s-labs.github.io/helm-charts
    releaseName: esphome
    version: 3.7.3
    valuesFile: esphome.values.yaml
  - name: app-template
    repo: https://bjw-s-labs.github.io/helm-charts
    releaseName: vikunja
    version: 5.0.1
    valuesFile: vikunja.values.yaml
  - name: app-template
    repo: https://bjw-s-labs.github.io/helm-charts
    releaseName: paperless
    version: 5.0.1
    valuesFile: paperless.values.yaml
    apiVersions:
      - gateway.networking.k8s.io/v1/HTTPRoute