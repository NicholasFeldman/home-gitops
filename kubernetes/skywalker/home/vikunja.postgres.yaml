apiVersion: db.movetokube.com/v1alpha1
kind: Postgres

metadata:
  name: vikunja
  namespace: home

spec:
  database: vikunja
---
apiVersion: db.movetokube.com/v1alpha1
kind: PostgresUser

metadata:
  name: vikunja
  namespace: home

spec:
  role: vikunja
  database: vikunja
  secretName: vikunja-database-env
  privileges: OWNER
  secretTemplate:
    VIKUNJA_DATABASE_TYPE: "postgres"
    VIKUNJA_DATABASE_PASSWORD: "{{.Password}}"
    VIKUNJA_DATABASE_HOST: "{{.Host}}.database.svc.cluster.local"
    VIKUNJA_DATABASE_DATABASE: "{{.Database}}"
    VIKUNJA_DATABASE_USER: "{{.Role}}"
