controllers:
  main:
    containers:
      main:
        image:
          repository: vikunja/vikunja
          tag: 2.3.0
        env:
          TZ: America/New_York
        envFrom:
          - secretRef:
              name: vikunja-database-env-vikunja
          - secretRef:
              name: vikunja-env

persistence:
  files:
    enabled: true
    mountPath: /app/vikunja/files
    size: 1Gi

service:
  main:
    controller: main
    ports:
      http:
        port: 3456

route:
  main:
    enabled: true
    parentRefs:
      - name: feldman-in
        namespace: istio-system
    hostnames: ["tasks.feldman.in"]
