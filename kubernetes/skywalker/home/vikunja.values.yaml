controllers:
  main:
    containers:
      main:
        image:
          repository: vikunja/vikunja
          tag: 2.3.0
        env:
          TZ: America/New_York
        envFrom:
          - secretRef:
              name: vikunja-database-env-vikunja
          - secretRef:
              name: vikunja-env
        securityContext:
          runAsUser: 0
          runAsGroup: 0
          fsGroup: 0


persistence:
  files:
    enabled: true
    size: 1Gi
    accessMode: ReadWriteOnce
    globalMounts: 
      - path: /app/vikunja/files

service:
  main:
    controller: main
    ports:
      http:
        port: 3456

route:
  main:
    enabled: true
    parentRefs:
      - name: feldman-in
        namespace: istio-system
    hostnames: ["tasks.feldman.in"]
    rules:
      - backendRefs:
          - name: vikunja
            port: 3456
            namespace: home
