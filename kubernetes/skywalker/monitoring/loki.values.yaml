# Single-node homelab: monolithic Loki on a local PVC, no object storage.
deploymentMode: SingleBinary

loki:
  auth_enabled: false

  commonConfig:
    replication_factor: 1

  storage:
    type: filesystem

  schemaConfig:
    configs:
      - from: "2024-04-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: loki_index_
          period: 24h

  ingester:
    chunk_encoding: snappy

  querier:
    max_concurrent: 2

  limits_config:
    retention_period: 30d
    volume_enabled: true
    reject_old_samples: true
    reject_old_samples_max_age: 168h

  compactor:
    retention_enabled: true
    delete_request_store: filesystem

singleBinary:
  replicas: 1
  persistence:
    enabled: true
    size: 20Gi
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      memory: 2Gi
  extraEnv:
    - name: GOMEMLIMIT
      value: 1800MiB

gateway:
  enabled: false

chunksCache:
  enabled: false
resultsCache:
  enabled: false

lokiCanary:
  enabled: false
test:
  enabled: false

sidecar:
  rules:
    enabled: false

minio:
  enabled: false

monitoring:
  serviceMonitor:
    enabled: true
    metricsInstance:
      enabled: false
  selfMonitoring:
    enabled: false

backend:
  replicas: 0
read:
  replicas: 0
write:
  replicas: 0
