apiVersion: v1
kind: ConfigMap

metadata:
  name: mosquitto-config
  namespace: monitoring

data:
  mosquitto.conf: |
    listener 1883
    protocol mqtt

    allow_anonymous false
    password_file /run/secrets/mosquitto/passwd
    acl_file /mosquitto/config/acl

    # retained messages and queued QoS 1/2 traffic survive a restart
    persistence true
    persistence_location /mosquitto/data/
    autosave_interval 300

    log_dest stdout
    log_type error
    log_type warning
    log_type notice
    log_type information
    connection_messages true

  # This is a shared homelab broker, so every client gets its own user and its
  # own topic tree. With allow_anonymous false, a user with no rule below has
  # no access at all -- adding a client means adding a stanza here, a line in
  # the passwd secret, and a reseal.
  acl: |
    user meshcore
    topic readwrite meshcore/#
