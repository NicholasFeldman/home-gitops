apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

metadata:
  name: mosquitto

resources:
  - mosquitto.configmap.yaml
  - mosquitto-passwd.sealed-secret.yaml
  - mosquitto.virtual-service.yaml

helmCharts:
  - name: app-template
    repo: https://bjw-s-labs.github.io/helm-charts
    releaseName: mosquitto
    version: 5.0.1
    namespace: monitoring
    valuesFile: mosquitto.values.yaml
