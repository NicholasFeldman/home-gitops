controllers:
  mosquitto:
    strategy: Recreate
    containers:
      app:
        image:
          repository: docker.io/library/eclipse-mosquitto
          tag: 2.0.22
        env:
          TZ: America/New_York
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            memory: 128Mi
        probes:
          liveness:
            enabled: true
            custom: true
            spec:
              tcpSocket:
                port: 1883
              initialDelaySeconds: 10
              periodSeconds: 30
              failureThreshold: 3
          readiness:
            enabled: true
            custom: true
            spec:
              tcpSocket:
                port: 1883
              initialDelaySeconds: 5
              periodSeconds: 10
              failureThreshold: 3

defaultPodOptions:
  securityContext:
    # the mosquitto user baked into the image; fsGroup is what makes the
    # Longhorn volume writable and the mode-0640 password file readable
    runAsUser: 1883
    runAsGroup: 1883
    fsGroup: 1883
    fsGroupChangePolicy: OnRootMismatch

persistence:
  data:
    enabled: true
    accessMode: ReadWriteOnce
    size: 1Gi
    globalMounts:
      - path: /mosquitto/data
  config:
    enabled: true
    type: configMap
    name: mosquitto-config
    # mosquitto warns (and a future release will refuse) on a world-readable
    # acl file; the configMap default of 0644 trips that
    defaultMode: 416 # 0640
    globalMounts:
      - path: /mosquitto/config
  passwd:
    enabled: true
    type: secret
    name: mosquitto-passwd
    defaultMode: 416 # 0640
    globalMounts:
      - path: /run/secrets/mosquitto

service:
  app:
    controller: mosquitto
    ports:
      mqtt:
        enabled: true
        primary: true
        port: 1883
