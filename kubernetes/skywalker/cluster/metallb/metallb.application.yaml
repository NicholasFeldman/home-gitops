apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: skywalker-cluster-metallb
  namespace: cluster

spec:
  destination:
    namespace: cluster
    name: in-cluster
  project: skywalker
  source:
    chart: metallb
    repoURL: https://metallb.github.io/metallb
    targetRevision: 0.16.2
    helm:
      releaseName: metallb
      # L2 mode only, so skip the frr-k8s BGP backend that 0.16 enables by default
      valuesObject:
        frrk8s:
          enabled: false
  ignoreDifferences:
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
      jsonPointers:
        - /spec/conversion/webhook/clientConfig/caBundle
