apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet

metadata:
  name: skywalker
  namespace: cluster

spec:
  generators:
    - list:
        elements:
          - name: application
          - name: cluster
          - name: database
          - name: home
          - name: istio-system
          - name: kube-system
          - name: longhorn-system
          - name: media
          - name: monitoring
          - name: printers
  template:
    metadata:
      name: 'skywalker-{{name}}'
    spec:
      project: skywalker
      source:
        repoURL: https://github.com/NicholasFeldman/home-gitops.git
        targetRevision: HEAD
        path: 'kubernetes/skywalker/{{name}}'
      destination:
        server: https://kubernetes.default.svc
        namespace: '{{name}}'

      ignoreDifferences:
        - group: admissionregistration.k8s.io
          kind: ValidatingWebhookConfiguration
          name: istiod-default-validator
          jsonPointers:
            - /webhooks/0/failurePolicy
        - group: admissionregistration.k8s.io
          kind: ValidatingWebhookConfiguration
          name: istio-validator-istio-system
          jsonPointers:
            - /webhooks/0/failurePolicy

        - kind: ServiceAccount
          name: feldman-in-istio
