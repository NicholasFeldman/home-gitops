apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

metadata:
  name: mariadb

resources:
  - mariadb.sealed-secret.yaml
  - mariadb.virtual-service.yaml

helmCharts:
  - name: app-template
    repo: https://bjw-s-labs.github.io/helm-charts
    releaseName: mariadb
    version: 5.3.0
    namespace: database
    valuesFile: mariadb.values.yaml
