apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: skywalker-database-blackbox-exporter
  namespace: cluster

spec:
  destination:
    namespace: database
    name: in-cluster
  project: skywalker
  source:
    chart: prometheus-blackbox-exporter
    repoURL: https://prometheus-community.github.io/helm-charts
    targetRevision: 11.21.1
    helm:
      releaseName: blackbox-exporter
      valuesObject:
        # Same service name and port the bitnami kube-prometheus chart used, so the
        # Probes in monitoring/probes.yaml keep resolving.
        fullnameOverride: kube-prometheus-blackbox-exporter
        service:
          port: 19115
