apiVersion: postgresql.cnpg.io/v1
kind: Cluster

metadata:
  name: primary-cluster

spec:
  instances: 3

  storage:
    storageClass: local-path
    size: 6Gi

  # local-path lives on each node's OS disk. Only vt5g6 and a7h7w have theirs on
  # NVMe: b4k1d's is on naboo's HDD mirror, and k2h8d's and ga9vf's are on
  # kamino's PNY SATA mirror, where Postgres writes stall etcd.
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: kubernetes.io/hostname
                operator: NotIn
                values:
                  - skywalker-worker-b4k1d
                  - skywalker-control-plane-k2h8d
                  - skywalker-worker-ga9vf

  monitoring:
    enablePodMonitor: true

  enableSuperuserAccess: true

  backup:
    barmanObjectStore:
      data:
        compression: bzip2
      wal:
        compression: bzip2
        maxParallel: 8
      destinationPath: "s3://feldman-skywalker-barman"
      serverName: primary-cluster-v3
      s3Credentials:
        accessKeyId:
          name: postgres-s3
          key: ACCESS_KEY_ID
        secretAccessKey:
          name: postgres-s3
          key: ACCESS_SECRET_KEY

  bootstrap:
    recovery:
      source: &previousName primary-cluster-v2

  externalClusters:
    - name: *previousName
      barmanObjectStore:
        destinationPath: s3://feldman-skywalker-barman
        s3Credentials:
          accessKeyId:
            name: postgres-s3
            key: ACCESS_KEY_ID
          secretAccessKey:
            name: postgres-s3
            key: ACCESS_SECRET_KEY
