global:
  security:
    # Newer bitnami subcharts refuse non-bitnami image repositories without this.
    allowInsecureImages: true
  envFrom:
  - secretRef:
      name: authentik-env
  - secretRef:
      name: authentik-database-env-authentik-db
  resources:
    requests:
      cpu: 1000m
      memory: 512Mi
    limits:
      cpu: 2000m
      memory: 1Gi
server:
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
  
redis:
  enabled: true
  # Bitnami pulled its images from docker.io/bitnami; the same tags live on in bitnamilegacy.
  # authentik drops Redis entirely in 2025.10.
  image:
    repository: bitnamilegacy/redis
  master:
    persistence:
      enabled: false