global:
  env:
  # Required from authentik 2026.11; used for links and redirects from 2026.8.
  - name: AUTHENTIK_WEB__BASE_URL
    value: https://authentik.feldman.tech
  envFrom:
  - secretRef:
      name: authentik-env
  - secretRef:
      name: authentik-database-env-authentik-db
  resources:
    requests:
      cpu: 1000m
      memory: 512Mi
    limits:
      cpu: 2000m
      memory: 1Gi
server:
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
