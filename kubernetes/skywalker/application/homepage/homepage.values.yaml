image:
  repository: ghcr.io/gethomepage/homepage
  tag: v2.7.0
env:
  TZ: America/New_York
  # Required since v1.0; requests for any other Host are rejected
  HOMEPAGE_ALLOWED_HOSTS: homepage.feldman.in
service:
  main:
    ports:
      http:
        port: 3000
persistence:
  config:
    enabled: true
    mountPath: /app/config
    size: 1Gi
addons:
  codeserver:
      enabled: true
      volumeMounts:
        - name: config
          mountPath: /app/config